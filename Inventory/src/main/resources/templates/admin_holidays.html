<!-- src/main/resources/templates/admin_holidays.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>休業日マスタ管理 - 備品在庫管理システム</title>
</head>
<body>
<main>
    <h2 class="mb-4">休業日(祝日・独自休日)マスタ管理</h2>

    <div class="row">
        <!-- 独自休業日追加フォーム -->
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white fw-bold">個別休業日の追加</div>
                <div class="card-body">
                    <form th:action="@{/admin/holidays/add}" method="post" class="d-flex flex-column gap-3">
                        <div>
                            <label for="holidayDate" class="form-label">日付 <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="holidayDate" name="holidayDate" required>
                        </div>
                        <div>
                            <label for="holidayName" class="form-label">休業日名 (例: 創立記念日) <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="holidayName" name="holidayName" required>
                        </div>
                        <button type="submit" class="btn btn-primary mt-2">追加（上書き）する</button>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- CSVインポート -->
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white fw-bold">内閣府 祝日CSVのインポート</div>
                <div class="card-body">
                    <form th:action="@{/admin/holidays/import}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <input type="file" class="form-control" name="file" accept=".csv" required>
                            <div class="form-text text-muted mt-2">※内閣府が提供するCSVファイル（syukujitsu.csv）をそのままアップロードしてください。</div>
                        </div>
                        <button type="submit" class="btn btn-secondary w-100">アップロードして更新</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 登録済み一覧 (追加部分) -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white fw-bold">登録済み休業日一覧</div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>日付</th>
                            <th>休業日名</th>
                            <th class="text-center">アクション</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="holiday : ${holidays}">
                            <td th:text="${#temporals.format(holiday.holidayDate, 'yyyy-MM-dd')}"></td>
                            <td th:text="${holiday.holidayName}"></td>
                            <td class="text-center">
                                <form th:action="@{/admin/holidays/{date}/delete(date=${holiday.holidayDate})}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('この休業日を削除します。よろしいですか？');">削除</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(holidays)}">
                            <td colspan="3" class="text-center text-muted py-4">登録されている休業日がありません。</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
