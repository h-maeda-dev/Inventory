<!-- src/main/resources/templates/admin_reasons.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>事由マスタ管理 - 備品在庫管理システム</title>
</head>
<body>
<main>
    <h2 class="mb-4">事由マスタ管理</h2>
    
    <div class="row">
        <!-- 申請事由 -->
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">申請事由一覧</div>
                <div class="card-body">
                    <form th:action="@{/admin/reasons/request}" method="post" th:object="${reasonForm}" class="mb-3 d-flex gap-2">
                        <input type="text" class="form-control" th:field="*{reasonText}" placeholder="新しい申請事由を入力">
                        <button type="submit" class="btn btn-primary text-nowrap">追加</button>
                    </form>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="r : ${requestReasons}">
                            <span th:text="${r.reasonText}"></span>
                            <!-- 削除ボタン追加 -->
                            <form th:action="@{/admin/reasons/request/{id}/delete(id=${r.id})}" method="post" class="m-0">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('この申請事由を削除しますか？');">削除</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 却下事由 -->
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">却下事由一覧</div>
                <div class="card-body">
                    <form th:action="@{/admin/reasons/reject}" method="post" th:object="${reasonForm}" class="mb-3 d-flex gap-2">
                        <input type="text" class="form-control" th:field="*{reasonText}" placeholder="新しい却下事由を入力">
                        <button type="submit" class="btn btn-danger text-nowrap">追加</button>
                    </form>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="r : ${rejectReasons}">
                            <span th:text="${r.reasonText}"></span>
                            <!-- 削除ボタン追加 -->
                            <form th:action="@{/admin/reasons/reject/{id}/delete(id=${r.id})}" method="post" class="m-0">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('この却下事由を削除しますか？');">削除</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
