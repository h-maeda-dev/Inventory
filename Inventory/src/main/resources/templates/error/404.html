<!-- src/main/resources/templates/error/404.html (新規作成) -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>ページが見つかりません - 備品在庫管理システム</title>
</head>
<body>
<main>
    <div class="row justify-content-center mt-5">
        <div class="col-md-8 text-center">
            <div class="card shadow-sm border-0 border-top border-warning border-4">
                <div class="card-body p-5">
                    <h2 class="text-warning mb-4">404 Not Found</h2>
                    <p class="lead mb-4">
                        お探しのページは見つかりませんでした。<br>
                        URLが間違っているか、ページが移動または削除された可能性があります。
                    </p>
                    <a th:href="@{/dashboard}" class="btn btn-primary px-5">ダッシュボードへ戻る</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
