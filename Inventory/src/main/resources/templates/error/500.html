<!-- src/main/resources/templates/error/500.html (新規作成) -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>システムエラー - 備品在庫管理システム</title>
</head>
<body>
<main>
    <div class="row justify-content-center mt-5">
        <div class="col-md-8 text-center">
            <div class="card shadow-sm border-0 border-top border-danger border-4">
                <div class="card-body p-5">
                    <h2 class="text-danger mb-4"><i class="bi bi-exclamation-triangle"></i> システムエラーが発生しました</h2>
                    <p class="lead mb-4">
                        申し訳ありません。処理中に予期せぬエラーが発生しました。<br>
                        しばらく時間をおいてから再度お試しください。
                    </p>
                    <div class="bg-light p-3 rounded mb-4 text-start">
                        <small class="text-muted fw-bold">エラーの理由がわからない場合：</small><br>
                        <small class="text-muted">この問題が繰り返し発生する場合は、システム管理者へお問い合わせください。</small>
                    </div>
                    <a th:href="@{/dashboard}" class="btn btn-primary px-5">ダッシュボードへ戻る</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
