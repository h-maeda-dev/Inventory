<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">備品在庫管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark mb-4" 
         th:classappend="${requestURI != null and requestURI.startsWith('/admin')} ? 'bg-danger' : 'bg-dark'">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}">備品在庫管理システム</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${requestURI != null and requestURI == '/dashboard'} ? 'active'" th:href="@{/dashboard}">ダッシュボード</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${requestURI != null and requestURI.startsWith('/items')} ? 'active'" th:href="@{/items}">物品検索</a>
                    </li>
                    <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link dropdown-toggle" href="#" id="adminMenu" role="button" data-bs-toggle="dropdown" aria-expanded="false"
                           th:classappend="${requestURI != null and requestURI.startsWith('/admin')} ? 'active'">
                            管理者メニュー
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="adminMenu">
                            <li><a class="dropdown-item" th:href="@{/admin}">承認ワークフロー</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/items}">品目マスタ管理</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/history}">貸出履歴照会</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/users}">ユーザー管理</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/departments}">部署マスタ管理</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/holidays}">祝日マスタ管理</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/reasons}">事由マスタ管理</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/reset-approvals}">パスワードリセット承認</a></li>
							<li><hr class="dropdown-divider"></li>
							<li>
							    <form th:action="@{/admin/test-batch}" method="post" class="m-0 px-3 py-1">
							        <button type="submit" class="btn btn-sm btn-warning w-100 text-dark">通知バッチ手動実行</button>
							    </form>
							</li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="navbar-text me-3 text-white">
                        <span th:text="${loginUserInfo}">ユーザー情報</span>
                    </span>
                    <a th:href="@{/password-change}" class="btn btn-outline-light btn-sm me-2">パスワード変更</a>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-light btn-sm">ログアウト</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:replace="${content}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function(e) {
                const btn = form.querySelector('button[type="submit"]');
                if (btn) {
                    if (btn.classList.contains('disabled-on-submit')) {
                        e.preventDefault();
                        return;
                    }
                    btn.classList.add('disabled-on-submit');
                    setTimeout(() => { btn.disabled = true; }, 10);
                }
            });
        });
    </script>
</body>
</html>
