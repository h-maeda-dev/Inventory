<!-- src/main/resources/templates/login.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン - 備品在庫管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">備品在庫管理システム</h3>
            
            <div th:if="${param.logout}" class="alert alert-info text-center">ログアウトしました。</div>
            
            <!-- 認証失敗メッセージ（locked以外のエラーパラメータが付与されている場合） -->
            <div th:if="${param.error != null and (param.error[0] != 'locked')}" class="alert alert-danger text-center">
                社員IDまたはパスワードが正しくありません。
            </div>
            
            <!-- ロック時のエラーメッセージ -->
            <div th:if="${param.error != null and param.error[0] == 'locked'}" class="alert alert-danger text-center">
                パスワードを複数回間違えたため、セキュリティ保護のためにアカウントを一時的にロックしました。15分後に再度お試しください。
            </div>
            
            <div th:if="${errorMessage}" class="alert alert-warning text-center" th:text="${errorMessage}"></div>
            
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">社員ID</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus placeholder="例: 00000001">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">パスワード</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="パスワードを入力">
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary">ログイン</button>
                </div>
                <div class="text-center">
                    <a th:href="@{/password-reset/request}" class="small">パスワードを忘れた方はこちら</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
