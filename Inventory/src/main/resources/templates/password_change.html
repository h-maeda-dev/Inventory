<!-- src/main/resources/templates/password_change.html (新規) -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>パスワード変更 - 備品在庫管理システム</title>
</head>
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold pt-3 pb-2">
                    <h4 class="mb-0">パスワード変更</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/password-change}" method="post" th:object="${passwordChangeForm}">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label fw-bold">現在のパスワード <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'" id="currentPassword" th:field="*{currentPassword}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                        </div>
                        <div class="mb-4">
                            <label for="newPassword" class="form-label fw-bold">新しいパスワード <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" id="newPassword" th:field="*{newPassword}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                            <div class="form-text">8文字以上で入力してください。</div>
                        </div>
                        <div class="d-flex justify-content-between pt-3 border-top">
                            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">キャンセル</a>
                            <button type="submit" class="btn btn-primary px-4">変更する</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
