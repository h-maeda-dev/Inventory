<!-- src/main/resources/templates/password_reset_form.html (新規) -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワード再設定 - 備品在庫管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 450px;">
        <div class="card-body p-4">
            <h4 class="text-center mb-4">新しいパスワードの設定</h4>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <form th:action="@{/password-reset/update}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="mb-4">
                    <label for="newPassword" class="form-label">新しいパスワード</label>
                    <input type="password" id="newPassword" name="newPassword" class="form-control" required minlength="8">
                    <div class="form-text">8文字以上で入力してください。</div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">パスワードを更新してログインへ</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
