<!-- src/main/resources/templates/password_reset_request.html (新規) -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワードリセット申請 - 備品在庫管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 450px;">
        <div class="card-body p-4">
            <h4 class="text-center mb-4">パスワードリセット申請</h4>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <form th:action="@{/password-reset/request}" method="post">
                <div class="mb-3">
                    <label for="employeeId" class="form-label">社員ID</label>
                    <input type="number" id="employeeId" name="employeeId" class="form-control" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="email" class="form-label">登録メールアドレス</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary">リセットを申請する</button>
                </div>
                <div class="text-center">
                    <a th:href="@{/login}" class="small">ログイン画面へ戻る</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
